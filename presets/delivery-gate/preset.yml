schema_version: '1.0'
preset:
  id: delivery-gate
  name: Spec Kit Delivery Gate
  version: 0.1.0
  description: Require an approved demonstration baseline and evidence before delivery acceptance.
  author: bbjwz
  repository: https://github.com/bbjwz/speckit-delivery
  license: MIT
requires:
  speckit_version: '==1.0.12'
  extensions: [delivery]
provides:
  templates:
    - type: command
      name: speckit.implement
      file: commands/speckit.implement.md
      description: Enforce delivery baseline before implementation and evidence afterward
      replaces: speckit.implement
      strategy: wrap
