[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "speckit-delivery"
version = "0.1.0"
description = "Demonstrate, verify, and present Spec Kit deliveries"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "httpx>=0.28,<1", "playwright>=1.51,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1", "pytest-cov>=6,<8"]

[project.scripts]
speckit-delivery = "speckit_delivery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["runtime/speckit_delivery"]

[tool.hatch.build.targets.wheel.force-include]
"package.json" = "speckit_delivery/package.json"
"package-lock.json" = "speckit_delivery/package-lock.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["runtime", "."]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
