  problem: Users need a simple working greeting.
  expected_benefit: Expected to make first-use behavior predictable; benefit is not measured.
  implementation: A small command-line entrypoint with explicit output assertions.
  operations: Run locally with synthetic data; inspect nonzero exits before release.
  limitations: [This example demonstrates a CLI, not a production deployment.]
  brand: Spec Kit Delivery
  accent: '#245B78'
