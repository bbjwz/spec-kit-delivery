title: Example greeting delivery
obligations:
  - {id: FR-001, kind: requirement, text: Greet the user, source: spec.md}
  - {id: AC-001, kind: acceptance, text: Print hello and exit successfully, source: spec.md}
  - {id: T001, kind: task, text: Implement greeting, source: tasks.md}
scenarios:
  - id: greeting
    title: Greeting succeeds
    kind: cli
    obligations: [FR-001, AC-001, T001]
